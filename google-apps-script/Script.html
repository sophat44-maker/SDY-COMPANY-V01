<!-- Google Apps Script Enterprise Client Router & Renderers -->
<script>
  // Global client-side persistent state
  let appState = {
    currentView: 'home',
    theme: 'light',
    companyInfo: {},
    products: [],
    projects: [],
    gallery: [],
    team: [],
    blog: [],
    translations: [],
    currentLang: 'en',
    adminData: {
      inquiries: [],
      productsCount: 0,
      projectsCount: 0
    },
    activeAdminTab: 'messages',
    selectedProduct: null,
    selectedProject: null,
    selectedBlog: null,
    servicesFilter: 'All',
    productsFilter: 'All',
    projectsFilter: 'All'
  };

  // Client-side translations map
  let translationsMap = {};

  // Translation helper function
  function t(key, defaultVal) {
    const lang = appState.currentLang || 'en';
    if (translationsMap[key] && translationsMap[key][lang]) {
      return translationsMap[key][lang];
    }
    if (translationsMap[key] && translationsMap[key]['en']) {
      return translationsMap[key]['en'];
    }
    return defaultVal !== undefined ? defaultVal : key;
  }

  // Toggle Language Dropdown UI
  function toggleLangDropdown() {
    const dropdown = document.getElementById('lang-dropdown');
    if (dropdown) {
      if (dropdown.classList.contains('hidden')) {
        dropdown.classList.remove('hidden');
      } else {
        dropdown.classList.add('hidden');
      }
    }
  }

  // Change Language and update elements
  function changeLanguage(lang) {
    appState.currentLang = lang;
    localStorage.setItem('sdy_selected_language', lang);
    
    const currentLangText = document.getElementById('current-lang-text');
    if (currentLangText) {
      currentLangText.textContent = lang.toUpperCase();
    }
    
    const dropdown = document.getElementById('lang-dropdown');
    if (dropdown) {
      dropdown.classList.add('hidden');
    }
    
    // Update elements
    updateStaticTranslations();
    
    // Re-render sections that contain dynamic content
    renderServices();
    renderProducts();
    renderProjects();
    renderBlog();
  }

  function updateStaticTranslations() {
    // Nav Items (Header)
    updateElementText('nav-home', t('nav.home', 'Home'));
    updateElementText('nav-services', t('nav.services', 'Services'));
    updateElementText('nav-products', t('nav.products', 'Products'));
    updateElementText('nav-projects', t('nav.projects', 'Projects'));
    updateElementText('nav-about', t('nav.about', 'About Us'));
    updateElementText('nav-blog', t('nav.blog', 'Blog'));
    updateElementText('nav-contact', t('nav.contact', 'Contact'));
    
    // Mobile Nav Items
    updateElementText('mobile-nav-home', t('nav.home', 'Home'));
    updateElementText('mobile-nav-services', t('nav.services', 'Services'));
    updateElementText('mobile-nav-products', t('nav.products', 'Products'));
    updateElementText('mobile-nav-projects', t('nav.projects', 'Projects'));
    updateElementText('mobile-nav-about', t('nav.about', 'About Us'));
    updateElementText('mobile-nav-blog', t('nav.blog', 'Blog'));
    updateElementText('mobile-nav-contact', t('nav.contact', 'Contact'));

    // Hero Section
    updateElementText('hero-badge', t('home.premium_tag', 'Premium Construction & Joinery'));
    updateElementText('hero-title', t('home.hero_title', 'High Precision Joinery & Steel Solutions in Cambodia'));
    updateElementText('hero-desc', t('home.hero_desc', 'Operating specialized heavy wood factories and pre-engineered steel mills directly in Phnom Penh to secure turn-key compliance, zero-middleman cost, and pristine luxury fit-outs.'));
    updateElementText('hero-btn-products', t('home.explore_btn', 'Explore Products'));
    updateElementText('hero-btn-contact', t('home.inquire_btn', 'Inquire Project'));
    
    // Intro Section
    updateElementText('intro-badge', t('intro.tag', 'Corporate Profile'));
    updateElementText('intro-title', t('intro.title', 'Integrated Engineering & Bespoke Interior Contracting'));
    
    // Dynamic intro description
    const introDescEl = document.getElementById('intro-desc');
    if (introDescEl) {
      const info = appState.companyInfo || {};
      const companyName = info.CompanyName || "SDY Company C&I";
      const descT = t('intro.desc', "At SDY Company C&I, we have unified Cambodia's premium interior design fit-out division with our massive high-precision manufacturing mill. Based in Phnom Penh, we build turn-key commercial renovations, high-durability pre-engineered metal plants, and double-glazed curtain facades under rigorous international quality controls.");
      const formatted = descT.replace("SDY Company C&I", `<span class="font-bold text-primary dark:text-accent" id="intro-company-name">${companyName}</span>`)
                             .replace("SDY C&I", `<span class="font-bold text-primary dark:text-accent" id="intro-company-name">${companyName}</span>`);
      introDescEl.innerHTML = formatted;
    }
    
    // Merits
    updateElementText('merit-1-title', t('intro.local_fab', 'Local Fabrication Control'));
    updateElementText('merit-1-desc', t('intro.local_fab_desc', '25,000 sqm heavy factory guarantees cost-savings and material traceability.'));
    updateElementText('merit-2-title', t('intro.compliance', 'Compliance Standard Certified'));
    updateElementText('merit-2-desc', t('intro.compliance_desc', 'Tested fire stop mechanisms certified up to 120-mins (UL fire code).'));
    updateElementText('intro-btn-history', t('intro.history_btn', 'Learn Our History &rarr;'));
    
    // Process Section
    updateElementText('process-badge', t('process.tag', 'Our Process'));
    updateElementText('process-title', t('process.title', 'Seamless Corporate Execution Lifecycle'));
    
    updateElementText('process-step-1-title', t('process.step_1_title', 'Consultation & Design'));
    updateElementText('process-step-1-desc', t('process.step_1_desc', 'Deep structural analysis, architectural concept design, and engineering optimization to finalize materials.'));
    updateElementText('process-step-2-title', t('process.step_2_title', 'Factory Fabrication'));
    updateElementText('process-step-2-desc', t('process.step_2_desc', 'High-precision manufacturing in our 25,000 sqm facility using CNC German tooling and lumber seasoning kilns.'));
    updateElementText('process-step-3-title', t('process.step_3_title', 'Precision Installation'));
    updateElementText('process-step-3-desc', t('process.step_3_desc', 'Seamless deployment, steel erection, curtain wall facade fitting, and premium joinery installation by certified teams.'));
    updateElementText('process-step-4-title', t('process.step_4_title', 'Certified Handover'));
    updateElementText('process-step-4-desc', t('process.step_4_desc', 'Rigorous safety audits, soundproof decibel checks, UL fire compliance approvals, and polished handover.'));
    
    // Testimonials Section Title
    updateElementText('testimonials-badge', t('testimonials.tag', 'Client Testimonials'));
    updateElementText('testimonials-title', t('testimonials.title', 'What Our Partners Say About Our Compliance'));
  }
  
  function updateElementText(id, val) {
    const el = document.getElementById(id);
    if (el) {
      el.innerHTML = val;
    }
  }

  // Hardcoded premium static data (e.g. Services, Testimonials) to keep sheets lightweight
  const STATIC_SERVICES = [
    { id: 'srv_1', name: 'Interior Fit-Out', description: 'Turnkey interior architecture, acoustics layout, and modular partitions for offices, retail, and hospitality.', category: 'Design & Fit-Out', details: 'Full concept-to-handover commercial fit-out.' },
    { id: 'srv_2', name: 'Bespoke Joinery', description: 'Precision luxury wood manufacturing of premium veneers, solid wooden paneling, and customized cabinets.', category: 'Doors & Manufacturing', details: 'Direct-from-factory kiln-seasoned lumber.' },
    { id: 'srv_3', name: 'UL Fire Rated Doors', description: 'Rigorous safety assemblies tested up to 120-minute fire resistance, ideal for hotel entries and high-rises.', category: 'Doors & Manufacturing', details: 'Compliant with structural fire codes.' },
    { id: 'srv_4', name: 'Pre-Engineered Steel Work', description: 'Heavy structural steel fabrication, architectural columns, factory framing, and robust metal structures.', category: 'Structural Steel', details: 'Engineered for highest regional wind loads.' },
    { id: 'srv_5', name: 'Double-Glazed Facades', description: 'Argon-insulated structural curtain wall systems, high-durability thermal barriers, and aluminum profiles.', category: 'Glass & Facade', details: 'Cuts heat transmission by up to 65%.' },
    { id: 'srv_6', name: 'Glass Balustrades', description: 'Laminated safety glass panels, minimal architectural rails, customized glass partitions, and fittings.', category: 'Glass & Facade', details: 'Heavy impact-resistant safety profiles.' }
  ];

  const STATIC_TESTIMONIALS = [
    { id: 't_1', quote: "SDY's local 25,000 sqm factory made sourcing premium acoustic fire doors extremely seamless. Their compliance team provided full UL test sheets immediately.", author: "Heng Sokanha", title: "Project Manager, Chip Mong Landmark" },
    { id: 't_2', quote: "The structural steel fabrication was precise, completed well within our timeline. True engineering excellence right here in Phnom Penh.", author: "David Vance", title: "Technical Director, Indochina Build" },
    { id: 't_3', quote: "Our luxury showroom fit-out looks phenomenal. Their wood joinery matching and veneer quality rival standard European imports at a fraction of the cost.", author: "Oknha Rathana", title: "Owner, Vattanac Premium retail" }
  ];

  // Initialize application on load
  window.addEventListener('DOMContentLoaded', () => {
    initTheme();
    loadServerData();
    setupScrollMonitoring();

    // Close language dropdown if clicked outside
    window.addEventListener('click', (e) => {
      const langBtn = document.getElementById('lang-btn-current');
      const langDropdown = document.getElementById('lang-dropdown');
      if (langDropdown && langBtn && !langBtn.contains(e.target) && !langDropdown.contains(e.target)) {
        langDropdown.classList.add('hidden');
      }
    });
  });

  // Theme Initializer
  function initTheme() {
    const savedTheme = localStorage.getItem('sdy-corporate-theme') || 'light';
    appState.theme = savedTheme;
    applyTheme();
  }

  function toggleTheme() {
    appState.theme = appState.theme === 'light' ? 'dark' : 'light';
    localStorage.setItem('sdy-corporate-theme', appState.theme);
    applyTheme();
  }

  function applyTheme() {
    const sunIcon = document.getElementById('theme-icon-sun');
    const moonIcon = document.getElementById('theme-icon-moon');
    
    if (appState.theme === 'dark') {
      document.documentElement.classList.add('dark');
      document.body.classList.add('dark');
      sunIcon.classList.remove('hidden');
      moonIcon.classList.add('hidden');
    } else {
      document.documentElement.classList.remove('dark');
      document.body.classList.remove('dark');
      sunIcon.classList.add('hidden');
      moonIcon.classList.remove('hidden');
    }
  }

  // Header Search Reveal Toggle
  function toggleSearch() {
    const searchInput = document.getElementById('header-search-bar');
    if (searchInput.classList.contains('w-0')) {
      searchInput.classList.remove('w-0', 'opacity-0');
      searchInput.classList.add('w-48', 'opacity-100', 'px-4');
      searchInput.focus();
    } else {
      searchInput.classList.add('w-0', 'opacity-0');
      searchInput.classList.remove('w-48', 'opacity-100', 'px-4');
    }
  }

  // Load database arrays via Google Apps Script RPC
  function loadServerData() {
    if (typeof google === 'undefined') {
      console.warn("GAS Environment missing. Simulating fallback data.");
      hideSplashLoader();
      return;
    }
    
    google.script.run
      .withSuccessHandler((response) => {
        if (response.status === 'success') {
          appState.companyInfo = response.companyInfo;
          appState.products = response.products;
          appState.projects = response.projects;
          appState.gallery = response.gallery;
          appState.team = response.team;
          appState.blog = response.blog;
          appState.translations = response.translations || [];
          
          // Populate translations Map
          if (Array.isArray(response.translations)) {
            response.translations.forEach(row => {
              const key = row.Key || row.key;
              if (key) {
                translationsMap[key] = {
                  en: row.English || row.english || '',
                  km: row.Khmer || row.khmer || '',
                  ko: row.Korean || row.korean || ''
                };
              }
            });
          }
          
          // Load language setting
          const savedLang = localStorage.getItem('sdy_selected_language') || 'en';
          appState.currentLang = savedLang;
          const currentLangText = document.getElementById('current-lang-text');
          if (currentLangText) {
            currentLangText.textContent = savedLang.toUpperCase();
          }
          
          // Apply corporate dynamic settings to header/footer
          applyCompanyProfileData();
          
          // Initial renders
          renderHome();
          renderServices();
          renderProducts();
          renderProjects();
          renderAbout();
          renderBlog();
          
          // Apply static translation keys
          updateStaticTranslations();
          
          // Sync with Admin variables
          loadAdminData();
        } else {
          showToast("Error synchronizing sheet: " + response.message);
        }
        hideSplashLoader();
      })
      .withFailureHandler((err) => {
        showToast("Server Connection Failed: " + err.toString());
        hideSplashLoader();
      })
      .getClientPortfolioData();
  }

  // Dynamic application settings mapping
  function applyCompanyProfileData() {
    const info = appState.companyInfo;
    
    // Bind intro context
    document.getElementById('intro-company-name').textContent = info.CompanyName || "SDY Company C&I";
    
    // Bind contact panels
    document.getElementById('contact-company-address').textContent = info.Address || "";
    document.getElementById('contact-company-phone').textContent = info.PhoneNumber || "";
    document.getElementById('contact-company-email').textContent = info.Email || "";
    
    // Social & messenger links
    if (info.TelegramLink) document.getElementById('telegram-link').href = info.TelegramLink;
    if (info.WhatsApp) document.getElementById('whatsapp-link').href = info.WhatsApp;
    
    // Embed map URL
    if (info.GoogleMapEmbedURL) {
      document.getElementById('google-maps-iframe').src = info.GoogleMapEmbedURL;
    }
    
    // Bind footers
    document.getElementById('footer-office-hours').textContent = info.OfficeHours || "Monday - Saturday: 8:00 AM - 5:00 PM";
    document.getElementById('footer-copyright').innerHTML = `&copy; 2026 ${info.CompanyName || 'SDY Company'}. All rights reserved.`;
  }

  function hideSplashLoader() {
    const splash = document.getElementById('splash-loader');
    if (splash) {
      splash.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => splash.remove(), 500);
    }
  }

  // SPA View Routing Navigation Control
  function navigate(viewName) {
    appState.currentView = viewName;
    
    // Hide all viewports
    document.querySelectorAll('.view-section').forEach(sec => {
      sec.classList.add('hidden');
    });
    
    // Reveal current viewport
    const activeSection = document.getElementById(`view-${viewName}`);
    if (activeSection) {
      activeSection.classList.remove('hidden');
    }
    
    // Update navigation active highlight styling classes
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.remove('bg-primary', 'text-white', 'shadow-md');
      btn.classList.add('text-dark/70', 'dark:text-white/70', 'hover:bg-black/5');
    });
    
    const activeNav = document.getElementById(`nav-${viewName}`);
    if (activeNav) {
      activeNav.classList.add('bg-primary', 'text-white', 'shadow-md');
      activeNav.classList.remove('text-dark/70', 'dark:text-white/70', 'hover:bg-black/5');
    }
    
    // Scroll window smoothly back to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    // Close mobile menu if opened
    const mobileMenu = document.getElementById('mobile-menu');
    mobileMenu.classList.add('hidden');
  }

  // Toggle Mobile Menu Drawer
  function toggleMobileMenu() {
    const mobileMenu = document.getElementById('mobile-menu');
    if (mobileMenu.classList.contains('hidden')) {
      mobileMenu.classList.remove('hidden');
    } else {
      mobileMenu.classList.add('hidden');
    }
  }

  // ==================== RENDERING COMPONENT ENGINES ====================

  // Render Home
  function renderHome() {
    const grid = document.getElementById('testimonials-grid-container');
    grid.innerHTML = '';
    
    STATIC_TESTIMONIALS.forEach(item => {
      const card = document.createElement('div');
      card.className = "p-6 rounded-2xl bg-white dark:bg-dark border border-black/5 dark:border-white/5 shadow-sm space-y-4 sleek-card flex flex-col justify-between";
      card.innerHTML = `
        <div class="space-y-3">
          <!-- Star Ratings -->
          <div class="flex gap-1 text-amber-400">
            ${Array(5).fill('<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>').join('')}
          </div>
          <p class="text-xs text-dark/65 dark:text-white/65 leading-relaxed italic">"${item.quote}"</p>
        </div>
        <div class="pt-4 border-t border-black/5 dark:border-white/5 flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center font-bold text-xs text-primary dark:text-accent">
            ${item.author.charAt(0)}
          </div>
          <div>
            <h4 class="font-bold text-xs text-dark dark:text-white">${item.author}</h4>
            <p class="text-[10px] text-dark/45 dark:text-white/40 font-medium">${item.title}</p>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Service translation keys mapping for the 6 static home/services showcase items
  const serviceTranslationKeys = {
    'srv_1': { name: 'service.s1.name', desc: 'service.s1.description' },
    'srv_2': { name: 'service.s4.name', desc: 'service.s4.description' },
    'srv_3': { name: 'service.s7.name', desc: 'service.s7.description' },
    'srv_4': { name: 'service.s9.name', desc: 'service.s9.description' },
    'srv_5': { name: 'service.s11.name', desc: 'service.s11.description' },
    'srv_6': { name: 'service.s10.name', desc: 'service.s10.description' }
  };

  // Render Services
  function renderServices() {
    const tabsContainer = document.getElementById('services-tabs-container');
    const grid = document.getElementById('services-cards-grid');
    if (!tabsContainer || !grid) return;
    
    // Map unique tabs with translation keys
    const categoryKeys = {
      'All': 'services.cat_all',
      'Design & Fit-Out': 'services.cat_design_fitout',
      'Doors & Manufacturing': 'services.cat_doors_manufacturing',
      'Structural Steel': 'services.cat_structural_steel',
      'Glass & Facade': 'services.cat_glass_facade'
    };
    const categories = ['All', 'Design & Fit-Out', 'Doors & Manufacturing', 'Structural Steel', 'Glass & Facade'];
    tabsContainer.innerHTML = '';
    
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = `px-4.5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${appState.servicesFilter === cat ? 'bg-primary text-white shadow-md' : 'bg-white dark:bg-dark text-dark/70 dark:text-white/70 border border-black/5'}`;
      btn.textContent = t(categoryKeys[cat] || cat, cat);
      btn.onclick = () => {
        appState.servicesFilter = cat;
        renderServices();
      };
      tabsContainer.appendChild(btn);
    });

    grid.innerHTML = '';
    const filtered = STATIC_SERVICES.filter(srv => appState.servicesFilter === 'All' || srv.category === appState.servicesFilter);
    
    filtered.forEach(srv => {
      const card = document.createElement('div');
      card.className = "p-6 rounded-2xl bg-white dark:bg-dark border border-black/5 dark:border-white/5 shadow-sm space-y-4 sleek-card flex flex-col justify-between";
      
      const keys = serviceTranslationKeys[srv.id];
      const srvName = keys ? t(keys.name, srv.name) : srv.name;
      const srvDesc = keys ? t(keys.desc, srv.description) : srv.description;
      const displayCategory = t(categoryKeys[srv.category] || srv.category, srv.category);
      
      card.innerHTML = `
        <div class="space-y-3">
          <span class="text-[9px] bg-primary/10 text-primary dark:text-accent font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider inline-block">${displayCategory}</span>
          <h3 class="font-bold text-lg text-dark dark:text-white">${srvName}</h3>
          <p class="text-xs text-dark/60 dark:text-white/60 leading-relaxed">${srvDesc}</p>
        </div>
        <div class="pt-4 border-t border-black/5 dark:border-white/10 flex items-center justify-between">
          <span class="text-[11px] text-dark/45 dark:text-white/45 font-semibold">${srv.details}</span>
          <button onclick="navigate('contact'); document.getElementById('form-subject').value = '${srvName} Estimate';" class="p-2 rounded-lg bg-primary/5 hover:bg-primary/20 text-primary dark:text-accent font-bold text-xs transition-colors">
            ${t('services.inquire_division', 'Inquire Division')} &rarr;
          </button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Render Products
  function renderProducts() {
    const tabsContainer = document.getElementById('products-tabs-container');
    const grid = document.getElementById('products-grid-container');
    if (!tabsContainer || !grid) return;
    
    const categoryKeys = {
      'All': 'services.cat_all',
      'Doors': 'products.cat_doors',
      'Furniture': 'products.cat_furniture',
      'Steel': 'products.cat_steel',
      'Glass': 'products.cat_glass'
    };
    const categories = ['All', 'Doors', 'Furniture', 'Steel', 'Glass'];
    tabsContainer.innerHTML = '';
    
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = `px-4.5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${appState.productsFilter === cat ? 'bg-primary text-white shadow-md' : 'bg-white dark:bg-dark text-dark/70 dark:text-white/70 border border-black/5'}`;
      btn.textContent = t(categoryKeys[cat] || cat, cat);
      btn.onclick = () => {
        appState.productsFilter = cat;
        renderProducts();
      };
      tabsContainer.appendChild(btn);
    });

    grid.innerHTML = '';
    const filtered = appState.products.filter(prod => {
      const matchesCat = appState.productsFilter === 'All' || prod.category === appState.productsFilter;
      return matchesCat;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<p class="text-xs text-dark/40 dark:text-white/40 text-center col-span-3 py-12">${t('admin.no_products_found', 'No materials matching filters found.')}</p>`;
      return;
    }

    filtered.forEach(prod => {
      const card = document.createElement('div');
      card.className = "group rounded-2xl overflow-hidden bg-white dark:bg-dark border border-black/5 dark:border-white/5 shadow-sm space-y-4 sleek-card cursor-pointer";
      card.onclick = () => openProductModal(prod);
      
      const lang = appState.currentLang || 'en';
      let prodName = prod.name;
      let prodDesc = prod.description;
      if (lang === 'km') {
        prodName = prod.ProductName_KH || prod.name;
        prodDesc = prod.Description_KH || prod.description;
      } else if (lang === 'ko') {
        prodName = prod.ProductName_KO || prod.name;
        prodDesc = prod.Description_KO || prod.description;
      } else {
        prodName = prod.ProductName_EN || prod.name;
        prodDesc = prod.Description_EN || prod.description;
      }
      
      const displayCategory = t(categoryKeys[prod.category] || prod.category, prod.category);
      
      card.innerHTML = `
        <div class="relative aspect-square overflow-hidden bg-black/5">
          <img src="${prod.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${prodName}" />
          <span class="absolute top-3 left-3 bg-white/95 dark:bg-dark/95 text-dark dark:text-white text-[9px] font-extrabold px-2.5 py-1 rounded-md uppercase tracking-wider shadow-sm z-10">${displayCategory}</span>
        </div>
        <div class="p-6 space-y-3">
          <h4 class="font-bold text-base text-dark dark:text-white group-hover:text-primary dark:group-hover:text-accent transition-colors duration-300">${prodName}</h4>
          <p class="text-xs text-dark/60 dark:text-white/60 line-clamp-2 leading-relaxed">${prodDesc}</p>
          <div class="pt-3 border-t border-black/5 dark:border-white/15 flex justify-between items-center text-[10px] uppercase font-bold text-dark/45 dark:text-white/45 tracking-wider">
            <span>Mat: ${prod.material || 'Standard'}</span>
            <span class="text-primary dark:text-accent">${t('blog.read_article', 'View Spec Sheets')} &rarr;</span>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Internal product search filter
  function filterProducts() {
    const q = document.getElementById('product-internal-search').value.toLowerCase();
    const grid = document.getElementById('products-grid-container');
    if (!grid) return;
    grid.innerHTML = '';
    
    const filtered = appState.products.filter(prod => {
      const matchesCat = appState.productsFilter === 'All' || prod.category === appState.productsFilter;

  // ==================== VISITOR CONTACT PIPELINE ====================
  function submitContactForm(event) {
    event.preventDefault();
    
    const submitBtn = document.getElementById('form-submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting Inquiries...';
    
    const formPayload = {
      name: document.getElementById('form-name').value,
      company: document.getElementById('form-company').value || 'N/A',
      phone: document.getElementById('form-phone').value,
      email: document.getElementById('form-email').value,
      subject: document.getElementById('form-subject').value,
      message: document.getElementById('form-message').value
    };

    if (typeof google === 'undefined') {
      setTimeout(() => {
        showToast("Simulation: Form successfully written directly to Sheets!");
        document.getElementById('contact-inquiry-form').reset();
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Spec Proposals';
      }, 1000);
      return;
    }

    google.script.run
      .withSuccessHandler((response) => {
        if (response.status === 'success') {
          showToast(response.message);
          document.getElementById('contact-inquiry-form').reset();
          
          // Refresh inbox list dynamically if admin is viewing
          loadAdminData();
        } else {
          showToast("Error processing form: " + response.message);
        }
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Spec Proposals';
      })
      .withFailureHandler((err) => {
        showToast("Network pipeline failure: " + err.toString());
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Spec Proposals';
      })
      .saveContactMessage(formPayload);
  }
  // ==================== ENTERPRISE SECURE ADMIN CONSOLE ====================
  
  // Try to restore admin session from storage on load
  window.addEventListener('DOMContentLoaded', () => {
    checkAdminSessionOnLoad();
  });

  function checkAdminSessionOnLoad() {
    const token = localStorage.getItem('sdy_admin_token');
    if (token) {
      // Validate session server-side
      google.script.run
        .withSuccessHandler((isValid) => {
          if (isValid) {
            revealAdminDashboard();
          } else {
            localStorage.removeItem('sdy_admin_token');
          }
        })
        .verifySession(token);
    }
  }

  function handleAdminLogin(event) {
    event.preventDefault();
    const password = document.getElementById('admin-login-password').value;
    const loginBtn = document.getElementById('admin-login-btn');
    
    loginBtn.disabled = true;
    loginBtn.textContent = 'Verifying security signature...';
    
    google.script.run
      .withSuccessHandler((response) => {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Unlock Dashboard';
        
        if (response.status === 'success') {
          localStorage.setItem('sdy_admin_token', response.token);
          showToast(response.message);
          document.getElementById('admin-login-password').value = '';
          revealAdminDashboard();
        } else {
          showToast(response.message);
        }
      })
      .withFailureHandler((err) => {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Unlock Dashboard';
        showToast("Access Controller Failure: " + err.toString());
      })
      .adminLogin(password);
  }

  function handleAdminLogout() {
    const token = localStorage.getItem('sdy_admin_token');
    if (token) {
      google.script.run.adminLogout(token);
    }
    localStorage.removeItem('sdy_admin_token');
    
    // Switch visual state
    document.getElementById('admin-login-panel').classList.remove('hidden');
    document.getElementById('admin-dashboard-panel').classList.add('hidden');
    showToast("Session closed. Dashboard locked.");
  }

  function revealAdminDashboard() {
    document.getElementById('admin-login-panel').classList.add('hidden');
    document.getElementById('admin-dashboard-panel').classList.remove('hidden');
    setAdminTab('messages');
    loadAdminData();
  }

  function setAdminTab(tabName) {
    appState.activeAdminTab = tabName;
    
    document.querySelectorAll('.admin-panel').forEach(panel => {
      panel.classList.add('hidden');
    });

  function loadAdminData() {
    const token = localStorage.getItem('sdy_admin_token');
    if (!token) return;
    
    google.script.run
      .withSuccessHandler((response) => {
        if (response.status === 'success') {
          appState.adminData = response;
          
          // Re-sync local product/project listings
          appState.products = response.products;
          appState.projects = response.projects;
          appState.blog = response.blogs;
          
          // Update visual stats counters
          document.getElementById('stat-total-leads').textContent = response.analytics.totalLeads;
          document.getElementById('stat-pending-leads').textContent = response.analytics.pendingLeads;
          document.getElementById('stat-total-quotes').textContent = response.analytics.totalQuotationValue;
          document.getElementById('stat-products-count').textContent = response.productsCount;
          
          // Set badges count inside sidebar navigation menu if badges exist
          const inqBadge = document.getElementById('admin-inquiries-count');
          if (inqBadge) inqBadge.textContent = response.inquiries.length;
          const prodBadge = document.getElementById('admin-products-count');
          if (prodBadge) prodBadge.textContent = response.productsCount;
          
          // Set Company Profile settings form values
          const info = response.companyInfo;
          document.getElementById('config-company-name').value = info.CompanyName || '';
          document.getElementById('config-company-logo').value = info.Logo || '';
          document.getElementById('config-phone').value = info.PhoneNumber || '';
          document.getElementById('config-email').value = info.Email || '';
          document.getElementById('config-address').value = info.Address || '';
          document.getElementById('config-maps').value = info.GoogleMapEmbedURL || '';
          document.getElementById('config-telegram').value = info.TelegramLink || '';
          document.getElementById('config-whatsapp').value = info.WhatsApp || '';
          
          // Populate Real-Time Analytical Charts
          drawAnalyticsTrendChart(response.analytics.monthlyLeadTrends);
          
          // Render admin modules
          renderAdminInboxes();
          renderAdminQuotations();
          renderAdminProducts();
          renderAdminProjects();
          renderAdminBlogs();
          renderAdminAuditLogs();
        } else {
          showToast("Admin session expired. Please authenticate again.");
          handleAdminLogout();
        }
      })
      .withFailureHandler((err) => {
        showToast("Error retrieving administrative records: " + err.toString());
      })
      .getAdminData(token);
  }

  // Draw vertical lead trend bar charts dynamically
  function drawAnalyticsTrendChart(trends) {
    const chart = document.getElementById('chart-leads-trend');
    if (!chart) return;
    chart.innerHTML = '';
    
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    let maxVal = 1;
    
    // Find maximum count for relative height mapping
    months.forEach(m => {
      const val = trends[m] || 0;
      if (val > maxVal) maxVal = val;
    });
    
    months.forEach(m => {
      const val = trends[m] || 0;
      const pct = (val / maxVal) * 100;
      
      const barCol = document.createElement('div');
      barCol.className = "flex flex-col items-center gap-1.5 flex-1 group cursor-pointer";
      barCol.innerHTML = `
        <div class="w-full bg-slate-100 dark:bg-white/5 rounded-t-lg relative flex items-end h-24 overflow-hidden">
          <div class="bg-primary group-hover:bg-accent w-full transition-all duration-500 rounded-t-md" style="height: ${pct}%"></div>
          <!-- Popover counts on hover -->
          <span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 bg-dark text-white text-[9px] px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-20">${val} Leads</span>
        </div>
        <span class="text-[9px] font-mono font-bold text-dark/45 dark:text-white/45">${m}</span>
      `;
      chart.appendChild(barCol);
    });
  }

  // Google Drive asset base64 uploader helper
  function uploadModalAsset(type, fileInput) {
    const file = fileInput.files[0];
    if (!file) return;
    
    const token = localStorage.getItem('sdy_admin_token');
    if (!token) {
      showToast("Verification token missing. Please re-authenticate.");
      return;
    }
    
    const reader = new FileReader();
    reader.onload = function(e) {
      const base64Data = e.target.result;
      
      // Select appropriate upload status indicator
      let saveBtn;
      if (type === 'product') saveBtn = document.getElementById('product-save-btn');
      else if (type === 'project') saveBtn = document.getElementById('project-save-btn');
      else if (type === 'blog') saveBtn = document.getElementById('blog-save-btn');
      
      const originalText = saveBtn ? saveBtn.textContent : '';
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = "Uploading image attachment to Google Drive...";
      }
      
      google.script.run
        .withSuccessHandler((response) => {
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = originalText;
          }
          
          if (response.status === 'success') {
            showToast(response.message);
            // Inject returned CDN direct access URL back into correct form text input
            if (type === 'product') {
              document.getElementById('editor-product-image').value = response.url;
            } else if (type === 'project') {
              document.getElementById('editor-project-cover').value = response.url;
            } else if (type === 'blog') {
              document.getElementById('editor-blog-image').value = response.url;
            }
          } else {
            showToast("Drive Upload Error: " + response.message);
          }
        })
        .withFailureHandler((err) => {
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = originalText;
          }
          showToast("Network pipe interrupted during upload: " + err.toString());
        })
        .uploadFileToDrive(token, base64Data, file.name);
    };
    reader.readAsDataURL(file);
  }

  // Backup exporter triggers local JSON downloads
  function downloadBackupJSON() {
    const token = localStorage.getItem('sdy_admin_token');
    if (!token) return;
    
    google.script.run
      .withSuccessHandler((response) => {
        if (response.status === 'success') {
          // Dynamic browser file download triggers
          const blob = new Blob([response.data], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          const today = new Date().toISOString().substring(0, 10);
          
          link.href = url;
          link.download = `sdy_sheets_database_backup_${today}.json`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          
          showToast(response.message);
        } else {
          showToast("Export compiled failure: " + response.message);
        }
      })
      .exportDatabaseAsJSON(token);
  }

  // Backup restore parses JSON uploads and writes sheets
  function restoreDatabaseFromJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const token = localStorage.getItem('sdy_admin_token');
    if (!token) return;
    
    const confirmRestore = confirm("CRITICAL DISASTER WARNING: You are about to overwrite all sheets in your active Google Sheets database. This action is completely irreversible. Are you absolutely certain you want to proceed with restore?");
    if (!confirmRestore) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
      const jsonContent = e.target.result;
      
      // Reveal processing overlay
      const overlay = document.createElement('div');
      overlay.className = "fixed inset-0 z-50 bg-black/80 flex flex-col items-center justify-center gap-3 text-white text-xs";
      overlay.innerHTML = `
        <div class="w-10 h-10 border-4 border-accent border-t-transparent rounded-full animate-spin"></div>
        <p class="font-bold tracking-widest uppercase">Overwriting Sheets Database tables...</p>
        <p class="text-white/50 text-[10px]">Processing rollback block, please wait...</p>
      `;
      document.body.appendChild(overlay);
      
      google.script.run
        .withSuccessHandler((response) => {
          document.body.removeChild(overlay);
          if (response.status === 'success') {
            alert(response.message);
            // Refresh main application
            window.location.reload();
          } else {
            showToast("Database rollback aborted: " + response.message);
          }
        })
        .withFailureHandler((err) => {
          document.body.removeChild(overlay);
          showToast("Network pipe interrupted: " + err.toString());
        })
        .importDatabaseFromJSON(token, jsonContent);
    };
    reader.readAsText(file);
  }

  // Change Admin Security Credentials
  function handlePasswordChange(event) {
    event.preventDefault();
    const token = localStorage.getItem('sdy_admin_token');
    if (!token) return;
    
    const oldPass = document.getElementById('config-old-password').value;
    const newPass = document.getElementById('config-new-password').value;
    
    google.script.run
      .withSuccessHandler((response) => {
        if (response.status === 'success') {
          showToast(response.message);
          document.getElementById('password-change-form').reset();
        } else {
          showToast("Credentials update error: " + response.message);
        }
      })
      .changeAdminPassword(token, oldPass, newPass);
  }


  // ==================== SYSTEM TOASTS BANNERS ====================
  function showToast(text) {
    const toast = document.getElementById('system-toast');
    const toastText = document.getElementById('system-toast-text');
    
    toastText.textContent = text;
    toast.classList.remove('translate-y-36');
    toast.classList.add('translate-y-0');
    
    setTimeout(() => {
      toast.classList.remove('translate-y-0');
      toast.classList.add('translate-y-36');
    }, 4500);
  }

  // Back to top floating button trigger
  function setupScrollMonitoring() {
    const header = document.getElementById('main-header');
    const backToTopBtn = document.getElementById('back-to-top-btn');
    
    window.addEventListener('scroll', () => {
      // Header glass sticky scale effect
      if (window.scrollY > 30) {
        header.classList.remove('py-4');
        header.classList.add('py-2.5', 'shadow-lg');
      } else {
        header.classList.remove('py-2.5', 'shadow-lg');
        header.classList.add('py-4');
      }
      
      // Floating button reveal
      if (window.scrollY > 300) {
        backToTopBtn.classList.remove('translate-y-24', 'opacity-0');
        backToTopBtn.classList.add('translate-y-0', 'opacity-100');
      } else {
        backToTopBtn.classList.add('translate-y-24', 'opacity-0');
        backToTopBtn.classList.remove('translate-y-0', 'opacity-100');
      }
    });
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
