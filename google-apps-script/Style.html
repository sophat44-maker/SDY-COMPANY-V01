<!-- Tailwind CSS & Custom Corporate Brand Styles -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind Play CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          display: ['Space Grotesk', 'sans-serif'],
        },
        colors: {
          primary: '#0A4DA3',
          accent: '#1E88E5',
          dark: '#101828',
          'bg-light': '#F7F9FC'
        },
        boxShadow: {
          'sm': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
          'md': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
          'lg': '0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02)',
          'xl': '0 20px 25px -5px rgba(0, 0, 0, 0.03), 0 10px 10px -5px rgba(0, 0, 0, 0.01)',
          '2xl': '0 25px 50px -12px rgba(0, 0, 0, 0.05)',
        }
      }
    }
  }
</script>

<style>
  /* Custom Global Transitions & Glassmorphism Header */
  html {
    scroll-behavior: smooth;
    font-family: 'Inter', sans-serif;
  }
  
  body {
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  /* Custom glass effect for sticky header */
  .glass-header {
    background-color: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(10, 77, 163, 0.08);
  }
  
  .dark .glass-header {
    background-color: rgba(16, 24, 40, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  /* Custom Sleek Card Transitions */
  .sleek-card {
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  
  .sleek-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 25px -5px rgba(10, 77, 163, 0.05), 0 10px 10px -5px rgba(10, 77, 163, 0.02);
    border-color: rgba(10, 77, 163, 0.15);
  }
  
  .dark .sleek-card:hover {
    box-shadow: 0 20px 25px -5px rgba(255, 255, 255, 0.02), 0 10px 10px -5px rgba(255, 255, 255, 0.01);
    border-color: rgba(255, 255, 255, 0.12);
  }

  /* Elegant Custom Scrollbars */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  
  ::-webkit-scrollbar-thumb {
    background: rgba(10, 77, 163, 0.15);
    border-radius: 9999px;
  }
  
  .dark ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
  }
  
  ::-webkit-scrollbar-thumb:hover {
    background: #0A4DA3;
  }

  /* Fade entering animations */
  .fade-in-section {
    animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Hide raw dynamic templating indicators before rendering finishes */
  [v-cloak] {
    display: none;
  }
</style>
